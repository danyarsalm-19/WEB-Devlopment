<!DOCTYPE html>
<html lang="en">
<head>
    <h1 style="color: rgb(0, 21, 255);">My First Button</h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program</title>
    <style>
       
        .my-button {
            background-color: #ff0055;
            color: rgb(0, 0, 0);            
            padding: 28px 25px;       
            font-size: 32px;          
            border: none;             
            border-radius: 12px;      
            cursor: pointer;          
        }

      
        .my-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>My First Button</h1>
    <h2>Welcome to My Page</h2>
    
  
    <button class="my-button">Click here</button>

</body>
</html>
