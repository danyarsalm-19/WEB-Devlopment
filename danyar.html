<!DOCTYPE html>
<html lang="en">
<head>
    <h1 style="color: rgb(0, 21, 255);">My First Button</h1>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program</title>
    <style>
        /* ڕەنگدان و جوانکاری بۆ دوگمەکە */
        .my-button {
            background-color: #ff0055; /* ڕەنگی پشتێنە (شین) */
            color: rgb(0, 0, 0);             /* ڕەنگی دەقەکە (سپی) */
            padding: 28px 25px;       /* قەبارە و بۆشایی ناوەوە */
            font-size: 32px;          /* قەبارەی نووسین */
            border: none;             /* لابردنی هێڵی دەرەوە */
            border-radius: 12px;       /* خرتکردنەوەی گۆشەکانی دوگمەکە */
            cursor: pointer;          /* گۆڕینی شێوەی مۆشک کاتێک دەچێتە سەر دوگمەکە */
        }

        /* کاتێک მაوس لەسەر دوگمەکە دادەنێیت ڕەنگەکەی بگۆڕێت */
        .my-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>My First Button</h1>
    <h2>Welcome to My Page</h2>
    
    <!-- بەکارهێنانی دوگمەکە بە کلاسەکەیەوە -->
    <button class="my-button">Click here</button>

</body>
</html>
